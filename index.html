<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>时空管理局 · 生日快乐</title>
<style>
/* ========== 基础重置 ========== */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
html,body{
  width:100%;height:100%;overflow:hidden;
  font-family:'Comic Sans MS','STKaiti','KaiTi','PingFang SC',cursive,sans-serif;
  background:#000;user-select:none;-webkit-user-select:none;
  touch-action:manipulation;
  -webkit-font-smoothing:antialiased;
}

/* ========== 像素主题色板 ========== */
:root{
  --sky-top:#5c94fc;
  --sky-mid:#7ab0fc;
  --sky-bot:#a8d0fc;
  --grass:#4caf50;
  --grass-dark:#2e7d32;
  --grass-light:#66bb6a;
  --brick:#8d6e63;
  --brick-dark:#5d4037;
  --brick-line:#4e342e;
  --coin:#f7d44a;
  --coin-light:#ffe066;
  --coin-dark:#b8860b;
  --pipe:#2e7d32;
  --pipe-dark:#1b5e20;
  --text-shadow:2px 2px 0 #000;
}

/* ========== 页面容器 ========== */
.page{
  position:fixed;inset:0;display:none;
  opacity:0;transition:opacity .4s ease;
}
.page.active{display:block;opacity:1}
.page.fade-out{opacity:0}
.page.fade-in{opacity:1}

/* ========== 首页 · 超级玛丽第一关 ========== */
#home{
  background:linear-gradient(to bottom,var(--sky-top) 0%,var(--sky-mid) 60%,var(--sky-bot) 100%);
  overflow:hidden;
}

/* 天空装饰：太阳 */
.sun{
  position:absolute;top:40px;right:40px;width:36px;height:36px;
  background:radial-gradient(circle,#fff59d 0%,#fdd835 60%,#fbc02d 100%);
  border-radius:50%;
  box-shadow:0 0 20px rgba(253,216,53,.8),0 0 40px rgba(253,216,53,.5),0 0 70px rgba(253,216,53,.3);
  z-index:1;animation:sunPulse 3s ease-in-out infinite;
}
@keyframes sunPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}

/* 云朵：纯白像素拼成 */
.cloud{
  position:absolute;background:#fff;border-radius:50%;
  box-shadow:
    18px 0 0 #fff,36px 0 0 #fff,54px 0 0 #fff,-18px 0 0 #fff,
    9px -16px 0 #fff,27px -16px 0 #fff,45px -16px 0 #fff;
  width:18px;height:18px;z-index:1;filter:drop-shadow(0 2px 0 rgba(0,0,0,.1));
  animation:cloudFloat 30s linear infinite;
}
@keyframes cloudFloat{0%{transform:translateX(0)}100%{transform:translateX(20px)}}

/* 远山 */
.hill{position:absolute;bottom:18%;z-index:1}
.hill-left{
  left:3%;width:0;height:0;
  border-left:80px solid transparent;border-right:80px solid transparent;
  border-bottom:70px solid #2e7d32;
  filter:drop-shadow(2px 2px 0 #1b5e20);
}
.hill-right{
  right:5%;width:0;height:0;
  border-left:100px solid transparent;border-right:100px solid transparent;
  border-bottom:85px solid #388e3c;
  filter:drop-shadow(2px 2px 0 #2e7d32);
}

/* 标题区 */
.title-wrap{
  position:absolute;top:24px;left:50%;transform:translateX(-50%);
  text-align:center;z-index:10;white-space:nowrap;
}
.main-title{
  font-size:32px;color:var(--coin-light);letter-spacing:4px;font-weight:900;
  text-shadow:3px 3px 0 var(--coin-dark),-1px -1px 0 #fff,0 0 20px rgba(247,212,74,.6);
  background:rgba(0,0,0,.45);padding:8px 24px;border:3px solid var(--coin);
  border-radius:6px;display:inline-block;
  box-shadow:0 0 15px rgba(247,212,74,.4),inset 0 0 10px rgba(247,212,74,.15);
}
.sub-title{
  font-size:13px;color:#fff;margin-top:10px;letter-spacing:1px;
  text-shadow:1px 1px 0 #000,0 0 8px rgba(255,255,255,.4);
  background:rgba(0,0,0,.45);padding:5px 14px;border-radius:4px;
  border:1px solid rgba(247,212,74,.35);display:inline-block;
}

/* 进度显示（右上角） */
.progress-top{
  position:absolute;top:24px;right:24px;z-index:10;
  font-size:18px;color:var(--coin-light);font-weight:900;
  background:rgba(0,0,0,.55);padding:6px 14px;
  border:2px solid var(--coin);border-radius:4px;
  text-shadow:2px 2px 0 #000,0 0 8px rgba(247,212,74,.5);
}

/* 箱子区域 */
.boxes{
  position:absolute;bottom:24%;left:0;right:0;
  display:flex;justify-content:space-around;align-items:flex-end;
  padding:0 6px;z-index:5;flex-wrap:nowrap;gap:4px;
}
.box-item{display:flex;flex-direction:column;align-items:center;flex:0 0 auto}
.box{
  width:62px;height:62px;cursor:pointer;position:relative;
  background:linear-gradient(145deg,var(--coin-light) 0%,var(--coin) 50%,var(--coin-dark) 100%);
  border:3px solid var(--coin-dark);border-radius:4px;
  box-shadow:
    inset 2px 2px 0 rgba(255,250,200,.7),
    inset -3px -3px 0 rgba(141,110,99,.5),
    0 0 12px rgba(247,212,74,.4),
    3px 3px 0 rgba(0,0,0,.15);
  display:flex;align-items:center;justify-content:center;
  transition:transform .1s,box-shadow .2s;
}
.box:active{transform:scale(.92)}
.box .mark{
  font-size:30px;font-weight:900;color:#fff;line-height:1;
  text-shadow:2px 2px 0 var(--coin-dark),0 0 6px rgba(255,255,255,.6);
  transition:transform .25s ease-out;
}
.box.watched{
  background:linear-gradient(145deg,#ffe082 0%,#ffb300 50%,#ff8f00 100%);
  box-shadow:
    inset 2px 2px 0 rgba(255,250,200,.8),
    inset -3px -3px 0 rgba(141,110,99,.4),
    0 0 18px rgba(255,180,0,.7),
    3px 3px 0 rgba(0,0,0,.15);
}
.box.watched .mark{color:#fff;text-shadow:2px 2px 0 #e65100,0 0 10px #fff}
.box.bounce{animation:boxBounce .25s ease-out}
.box.bounce .mark{animation:markPulse .25s ease-out}
@keyframes boxBounce{
  0%{transform:translateY(0)}
  50%{transform:translateY(-25px)}
  70%{transform:translateY(5px)}
  100%{transform:translateY(0)}
}
@keyframes markPulse{
  0%{transform:scale(1)}
  50%{transform:scale(1.2)}
  100%{transform:scale(1)}
}
.box-name{
  margin-top:6px;font-size:11px;color:#fff;font-weight:bold;
  letter-spacing:1px;white-space:nowrap;
  text-shadow:1px 1px 0 #000,2px 2px 0 #000;
}

/* 进度条 */
.progress-bar-wrap{
  position:absolute;bottom:17%;left:50%;transform:translateX(-50%);
  width:50%;z-index:6;text-align:center;
}
.progress-text{
  color:#fff;font-size:12px;letter-spacing:1px;font-weight:bold;
  text-shadow:1px 1px 0 #000;
}
.progress-bar{display:flex;justify-content:center;gap:3px;margin-top:5px}
.progress-cell{
  width:16px;height:9px;background:rgba(255,255,255,.18);
  border:1px solid rgba(247,212,74,.35);border-radius:2px;
}
.progress-cell.filled{
  background:var(--coin);
  box-shadow:inset 1px 1px 0 #fff9c4,0 0 6px rgba(247,212,74,.6);
}

/* 地面：棕色砖块在下，绿色草地在上 */
.ground{position:absolute;bottom:0;left:0;right:0;height:15%;z-index:2}
.bricks{
  position:absolute;bottom:0;left:0;right:0;height:66.66%;
  background:var(--brick);
  background-image:
    linear-gradient(90deg,var(--brick-line) 0,var(--brick-line) 2px,transparent 2px),
    linear-gradient(var(--brick-line) 0,var(--brick-line) 2px,transparent 2px);
  background-size:32px 16px;
  border-top:2px solid var(--brick-dark);
}
.grass-layer{
  position:absolute;bottom:66.66%;left:0;right:0;height:33.34%;
  background:linear-gradient(to bottom,var(--grass) 0%,var(--grass-dark) 100%);
  border-top:3px solid var(--grass-dark);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.15);
}
.grass-top{
  position:absolute;bottom:calc(15% - 7px);left:0;right:0;height:14px;
  z-index:3;pointer-events:none;display:flex;
}
.grass-blade{flex:1;position:relative}
.grass-blade::before{
  content:'';position:absolute;bottom:0;left:50%;transform:translateX(-50%);
  width:5px;height:var(--blade-h,7px);background:var(--grass-light);
  border-radius:2px 2px 0 0;box-shadow:0 0 3px rgba(102,187,106,.5);
}

/* ========== 视频播放页 ========== */
#video-page{background:#000}
#video-el{
  width:100%;height:100%;object-fit:contain;background:#000;
  display:block;
}

/* 加载动画 */
.video-loading{
  position:absolute;inset:0;display:none;
  flex-direction:column;align-items:center;justify-content:center;
  z-index:105;background:rgba(0,0,0,.75);gap:14px;
}
.video-loading.show{display:flex}
.video-loading-box{
  width:44px;height:44px;background:var(--coin);border-radius:4px;
  animation:spinPixel 1s linear infinite;
  box-shadow:0 0 15px rgba(247,212,74,.6);
}
@keyframes spinPixel{
  0%{transform:rotate(0) scale(1)}
  25%{transform:rotate(90deg) scale(.8)}
  50%{transform:rotate(180deg) scale(1)}
  75%{transform:rotate(270deg) scale(.8)}
  100%{transform:rotate(360deg) scale(1)}
}
.loading-name{
  color:var(--coin-light);font-size:20px;font-weight:bold;
  text-shadow:2px 2px 0 #000,0 0 8px rgba(247,212,74,.5);
}
.loading-pct{
  color:#fff;font-size:14px;letter-spacing:1px;
  text-shadow:1px 1px 0 #000;
}
.loading-bar{
  width:60%;max-width:280px;height:8px;
  background:rgba(255,255,255,.15);border:1px solid rgba(247,212,74,.4);
  border-radius:4px;overflow:hidden;
}
.loading-bar-fill{
  height:100%;width:0%;
  background:linear-gradient(90deg,var(--coin),#ffd700);
  box-shadow:0 0 8px rgba(247,212,74,.6);
  transition:width .25s;
}
.retry-btn{
  margin-top:8px;background:rgba(0,0,0,.6);
  border:2px solid var(--coin);color:var(--coin-light);
  padding:10px 22px;font-family:inherit;font-size:14px;font-weight:bold;
  cursor:pointer;border-radius:4px;text-shadow:2px 2px 0 #000;
  min-height:44px;display:none;
}
.retry-btn.show{display:block}
.retry-btn:active{transform:scale(.92)}

/* 视频页按钮 */
.back-btn{
  position:absolute;top:20px;left:20px;
  background:rgba(0,0,0,.6);border:2px solid var(--coin);
  color:var(--coin-light);padding:10px 18px;
  font-family:inherit;font-size:16px;font-weight:bold;cursor:pointer;
  text-shadow:2px 2px 0 #000;box-shadow:3px 3px 0 rgba(0,0,0,.5);
  z-index:110;border-radius:4px;min-width:44px;min-height:44px;
  transition:transform .1s;
}
.back-btn:active{transform:scale(.92)}
.video-controls{
  position:absolute;bottom:30px;left:50%;transform:translateX(-50%);
  display:flex;gap:14px;z-index:110;
}
.video-controls button{
  background:rgba(0,0,0,.55);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
  border:2px solid rgba(255,255,255,.25);color:#fff;
  padding:12px 22px;font-family:inherit;font-size:15px;font-weight:bold;
  cursor:pointer;border-radius:4px;min-width:44px;min-height:44px;
  transition:transform .1s;text-shadow:1px 1px 0 #000;
}
.video-controls button:active{transform:scale(.92)}

/* 手机自动播放覆盖层 */
.play-overlay{
  position:absolute;inset:0;background:rgba(0,0,0,.5);
  z-index:106;display:none;align-items:center;justify-content:center;
  cursor:pointer;font-size:64px;color:#fff;
  text-shadow:0 0 20px rgba(255,255,255,.6);
}
.play-overlay.show{display:flex}

/* ========== 烟花页 ========== */
#fireworks-page{
  background:linear-gradient(to bottom,#0a0e27 0%,#1a1a3e 50%,#0d1b2a 100%);
  overflow:hidden;
}
.fw-grass{
  position:absolute;bottom:0;left:0;right:0;height:15%;
  background:linear-gradient(to bottom,#2d5a27 0%,#1a3d18 100%);
  z-index:5;border-top:3px solid #143010;
}
.fw-grass-top{
  position:absolute;bottom:15%;left:0;right:0;height:12px;
  z-index:5;pointer-events:none;display:flex;
}
.fw-grass-blade{flex:1;position:relative}
.fw-grass-blade::before{
  content:'';position:absolute;bottom:0;left:50%;transform:translateX(-50%);
  width:4px;height:var(--blade-h,6px);background:#4a8c3f;
  border-radius:2px 2px 0 0;box-shadow:0 0 2px rgba(74,140,63,.5);
}
#fw-canvas{position:absolute;inset:0;z-index:3}
.fw-text{
  position:absolute;top:18%;left:0;right:0;z-index:10;
  text-align:center;pointer-events:none;
}
.fw-line{
  font-size:clamp(30px,5vw,58px);font-weight:bold;
  font-family:'Comic Sans MS','STKaiti','KaiTi',cursive;
  letter-spacing:4px;line-height:1.2;
}
#fw-line-1{
  color:var(--coin-light);
  text-shadow:0 0 20px rgba(247,212,74,.8),0 0 40px rgba(247,212,74,.5),
              0 0 60px rgba(247,212,74,.3),3px 3px 0 var(--coin-dark);
  animation:fwGlow 2s ease-in-out infinite alternate;
}
#fw-line-2{
  color:#fff;margin-top:16px;
  text-shadow:0 0 20px rgba(255,255,255,.8),0 0 40px rgba(255,255,255,.5),2px 2px 0 #000;
}
@keyframes fwGlow{
  from{filter:brightness(1) drop-shadow(0 0 10px rgba(247,212,74,.5))}
  to{filter:brightness(1.3) drop-shadow(0 0 25px rgba(247,212,74,.9))}
}
.fw-hint{
  position:absolute;bottom:20px;left:50%;transform:translateX(-50%);
  color:rgba(255,255,255,.6);font-size:14px;z-index:10;cursor:pointer;
  background:rgba(0,0,0,.4);padding:8px 16px;border-radius:4px;
  border:1px solid rgba(255,255,255,.2);pointer-events:auto;
  min-height:44px;display:flex;align-items:center;
}

/* 星空（烟花页） */
.star-layer{position:absolute;inset:0;pointer-events:none;z-index:1}
.star{position:absolute;border-radius:50%;animation:twinkle ease-in-out infinite}
.star.glow{box-shadow:0 0 4px currentColor,0 0 8px currentColor}
@keyframes twinkle{0%,100%{opacity:.2}50%{opacity:1}}

/* ========== 移动端适配 ========== */
@media(max-width:600px){
  .main-title{font-size:22px;letter-spacing:3px;padding:6px 16px}
  .sub-title{font-size:10px;padding:4px 10px}
  .progress-top{font-size:14px;padding:4px 10px;top:16px;right:14px}
  .title-wrap{top:14px}
  .sun{width:28px;height:28px;top:28px;right:24px}
  .box{width:38px;height:38px;border-width:2px}
  .box .mark{font-size:18px}
  .box-name{font-size:9px;margin-top:3px}
  .boxes{bottom:22%;gap:2px;padding:0 4px}
  .progress-bar-wrap{width:75%;bottom:15%}
  .progress-cell{width:11px;height:7px}
  .video-controls button{padding:10px 16px;font-size:14px}
  .back-btn{font-size:14px;padding:8px 14px}
  .fw-line{letter-spacing:2px}
  .loading-name{font-size:18px}
}
</style>
</head>
<body>

<!-- ========== 首页 ========== -->
<div id="home" class="page active">
  <div class="sun"></div>
  <div class="hill hill-left"></div>
  <div class="hill hill-right"></div>
  <!-- 云朵 -->
  <div class="cloud" style="top:60px;left:8%"></div>
  <div class="cloud" style="top:110px;left:28%"></div>
  <div class="cloud" style="top:50px;left:48%"></div>
  <div class="cloud" style="top:100px;left:68%"></div>
  <div class="cloud" style="top:140px;left:18%"></div>
  <div class="cloud" style="top:130px;left:55%"></div>

  <div class="title-wrap">
    <div class="main-title">✦ 时空管理局 ✦</div>
    <div class="sub-title">检测到今日特殊能量波动 —— 女主角诞生日，九界通道开启</div>
  </div>

  <div class="progress-top" id="progress-top">⭐ 0 / 9</div>

  <div class="boxes" id="boxes"></div>

  <div class="progress-bar-wrap">
    <div class="progress-text" id="progress-text">收集进度：0 / 9</div>
    <div class="progress-bar" id="progress-bar"></div>
  </div>

  <div class="ground">
    <div class="grass-layer"></div>
    <div class="bricks"></div>
  </div>
  <div class="grass-top" id="grass-top"></div>
</div>

<!-- ========== 视频播放页 ========== -->
<div id="video-page" class="page">
  <video id="video-el" playsinline webkit-playsinline x5-playsinline preload="auto"></video>
  <div class="video-loading" id="video-loading">
    <div class="video-loading-box"></div>
    <div class="loading-name" id="loading-name"></div>
    <div class="loading-pct" id="loading-pct">准备中…</div>
    <div class="loading-bar"><div class="loading-bar-fill" id="loading-bar-fill"></div></div>
    <button class="retry-btn" id="retry-btn">重试加载</button>
  </div>
  <div class="play-overlay" id="play-overlay">▶</div>
  <button class="back-btn" id="back-btn">← 返回</button>
  <div class="video-controls">
    <button id="prev-btn">◀ 上一个</button>
    <button id="replay-btn">🔄 重放</button>
    <button id="next-btn">下一个 ▶</button>
  </div>
</div>

<!-- ========== 烟花页 ========== -->
<div id="fireworks-page" class="page">
  <div class="star-layer" id="fw-stars"></div>
  <canvas id="fw-canvas"></canvas>
  <div class="fw-text">
    <div class="fw-line" id="fw-line-1"></div>
    <div class="fw-line" id="fw-line-2"></div>
  </div>
  <div class="fw-grass"></div>
  <div class="fw-grass-top" id="fw-grass-top"></div>
  <div class="fw-hint" id="fw-hint">点击此处重新开始 ✦</div>
</div>

<script>
/* ========================================================
   数据配置：9 位男主
   ======================================================== */
const LEADS = [
  {id:'qinche',   name:'秦彻',   color:'#b8860b', video:'videos/秦彻.mp4'},
  {id:'qiyu',     name:'祁煜',   color:'#8b5cf6', video:'videos/祁煜.mp4'},
  {id:'gushiy',   name:'顾时夜', color:'#67b8d4', video:'videos/顾时夜.mp4'},
  {id:'qisili',   name:'齐司礼', color:'#4caf50', video:'videos/齐司礼.mp4'},
  {id:'xiaoyi',   name:'萧逸',   color:'#e53935', video:'videos/萧逸.mp4'},
  {id:'xiaoyin',  name:'夏萧因', color:'#b0b8c0', video:'videos/夏萧因.mp4'},
  {id:'lizeyan',  name:'李泽言', color:'#1565c0', video:'videos/李泽言.mp4'},
  {id:'zuoran',   name:'左然',   color:'#8d6e63', video:'videos/左然.mp4'},
  {id:'lujinghe', name:'陆景和', color:'#ce93d8', video:'videos/陆景和.mp4'}
];

const STORAGE_KEY = 'mario_birthday_progress_v2';

/* ========================================================
   状态变量
   ======================================================== */
let watched = [];          // 已观看的男主 id 列表
let curVideoIdx = -1;      // 当前播放的视频索引
let fwActive = false;      // 烟花是否激活
let audioCtx = null;       // 音频上下文
let videoLoadToken = 0;    // 视频加载令牌（防止并发）
let videoLoadTimer = null; // 加载进度定时器

const isMobile = /iPhone|iPad|iPod|Android|Mobile/i.test(navigator.userAgent);
const $ = id => document.getElementById(id);

/* DOM 元素引用 */
const home = $('home'), boxesEl = $('boxes');
const pt = $('progress-top'), pt2 = $('progress-text'), pb = $('progress-bar');
const videoPage = $('video-page'), videoEl = $('video-el');
const vl = $('video-loading'), playOverlay = $('play-overlay');
const backBtn = $('back-btn'), prevBtn = $('prev-btn');
const replayBtn = $('replay-btn'), nextBtn = $('next-btn');
const loadingName = $('loading-name'), loadingPct = $('loading-pct');
const loadingBarFill = $('loading-bar-fill'), retryBtn = $('retry-btn');
const fwPage = $('fireworks-page'), fwCanvas = $('fw-canvas');
const fwHint = $('fw-hint'), fwLine1 = $('fw-line-1'), fwLine2 = $('fw-line-2');
const fwStars = $('fw-stars'), grassTop = $('grass-top');

/* ========================================================
   页面切换（淡入淡出）
   ======================================================== */
function showPage(target) {
  const current = document.querySelector('.page.active');
  if (current === target) return;
  if (current) {
    current.classList.add('fade-out');
    setTimeout(() => {
      current.classList.remove('active', 'fade-out');
      target.classList.add('active', 'fade-in');
      setTimeout(() => target.classList.remove('fade-in'), 400);
    }, 400);
  } else {
    target.classList.add('active');
  }
}

/* ========================================================
   音频系统：Web Audio API 生成像素音效
   ======================================================== */
function getCtx() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
    catch(e) {}
  }
  return audioCtx;
}

// 硬币音效（点击箱子）
function playCoin() {
  const c = getCtx(); if (!c) return;
  if (c.state === 'suspended') c.resume();
  const o = c.createOscillator(), g = c.createGain();
  o.connect(g); g.connect(c.destination);
  o.type = 'square';
  o.frequency.setValueAtTime(988, c.currentTime);
  o.frequency.setValueAtTime(1319, c.currentTime + 0.05);
  g.gain.setValueAtTime(0.0001, c.currentTime);
  g.gain.exponentialRampToValueAtTime(0.25, c.currentTime + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + 0.2);
  o.start(c.currentTime); o.stop(c.currentTime + 0.2);
}

// 烟花爆炸音效
function playBoom() {
  const c = getCtx(); if (!c) return;
  if (c.state === 'suspended') c.resume();
  const bufferSize = c.sampleRate * 0.5;
  const buffer = c.createBuffer(1, bufferSize, c.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < bufferSize; i++) {
    data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / bufferSize, 2);
  }
  const noise = c.createBufferSource();
  noise.buffer = buffer;
  const filter = c.createBiquadFilter();
  filter.type = 'lowpass';
  filter.frequency.value = 1000;
  const g = c.createGain();
  g.gain.setValueAtTime(0.3, c.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + 0.5);
  noise.connect(filter); filter.connect(g); g.connect(c.destination);
  noise.start(c.currentTime);
}

// 通关音效
function playWin() {
  const c = getCtx(); if (!c) return;
  if (c.state === 'suspended') c.resume();
  const notes = [523, 659, 784, 1047];
  notes.forEach((freq, i) => {
    const o = c.createOscillator(), g = c.createGain();
    o.connect(g); g.connect(c.destination);
    o.type = 'square';
    o.frequency.setValueAtTime(freq, c.currentTime + i * 0.15);
    g.gain.setValueAtTime(0.0001, c.currentTime + i * 0.15);
    g.gain.exponentialRampToValueAtTime(0.2, c.currentTime + i * 0.15 + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + i * 0.15 + 0.25);
    o.start(c.currentTime + i * 0.15);
    o.stop(c.currentTime + i * 0.15 + 0.25);
  });
}

/* ========================================================
   进度管理（localStorage）
   ======================================================== */
function loadProgress() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    watched = saved ? JSON.parse(saved) : [];
    if (!Array.isArray(watched)) watched = [];
  } catch(e) { watched = []; }
}
function saveProgress() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(watched)); }
  catch(e) {}
}

/* ========================================================
   渲染首页：箱子 + 草叶 + 进度条
   ======================================================== */
function renderHome() {
  // 生成草叶
  grassTop.innerHTML = '';
  const bladeCount = Math.floor(window.innerWidth / 8);
  for (let i = 0; i < bladeCount; i++) {
    const blade = document.createElement('div');
    blade.className = 'grass-blade';
    blade.style.setProperty('--blade-h', (5 + Math.random() * 5) + 'px');
    grassTop.appendChild(blade);
  }

  // 生成箱子
  boxesEl.innerHTML = '';
  LEADS.forEach((lead, idx) => {
    const item = document.createElement('div');
    item.className = 'box-item';

    const box = document.createElement('div');
    box.className = 'box' + (watched.includes(lead.id) ? ' watched' : '');
    box.dataset.idx = idx;
    const mark = document.createElement('div');
    mark.className = 'mark';
    mark.textContent = watched.includes(lead.id) ? '★' : '?';
    box.appendChild(mark);

    const name = document.createElement('div');
    name.className = 'box-name';
    name.textContent = lead.name;

    item.appendChild(box);
    item.appendChild(name);
    boxesEl.appendChild(item);

    // 点击箱子
    box.addEventListener('click', (e) => {
      e.preventDefault();
      handleBoxClick(idx, box);
    });
  });

  updateProgress();
}

function updateProgress() {
  const count = watched.length;
  pt.textContent = '⭐ ' + count + ' / 9';
  pt2.textContent = '收集进度：' + count + ' / 9';
  pb.innerHTML = '';
  for (let i = 0; i < 9; i++) {
    const cell = document.createElement('div');
    cell.className = 'progress-cell' + (i < count ? ' filled' : '');
    pb.appendChild(cell);
  }
}

/* ========================================================
   点击箱子处理
   ======================================================== */
function handleBoxClick(idx, boxEl) {
  const lead = LEADS[idx];

  // 弹跳动画
  boxEl.classList.remove('bounce');
  void boxEl.offsetWidth; // 触发重排
  boxEl.classList.add('bounce');

  // 音效
  playCoin();

  // 记录进度（首次观看才记录）
  if (!watched.includes(lead.id)) {
    watched.push(lead.id);
    saveProgress();
    // 延迟更新样式，让弹跳动画先播放
    setTimeout(() => {
      boxEl.classList.add('watched');
      boxEl.querySelector('.mark').textContent = '★';
      updateProgress();
      // 全部收集完成 → 烟花
      if (watched.length === 9) {
        setTimeout(() => showFireworks(), 600);
      }
    }, 250);
  }

  // 打开视频（已看可重看，不限制次数）
  setTimeout(() => openVideo(idx), 200);
}

/* ========================================================
   视频播放页
   ======================================================== */
function openVideo(idx) {
  curVideoIdx = idx;
  const lead = LEADS[idx];
  showPage(videoPage);
  loadAndPlay(idx);
}

function loadAndPlay(idx) {
  const lead = LEADS[idx];
  const token = ++videoLoadToken;

  // 重置 UI
  videoEl.pause();
  loadingName.textContent = lead.name;
  loadingPct.textContent = '准备中…';
  loadingBarFill.style.width = '0%';
  vl.classList.add('show');
  retryBtn.classList.remove('show');
  playOverlay.classList.remove('show');

  // 清理旧定时器
  if (videoLoadTimer) { clearInterval(videoLoadTimer); videoLoadTimer = null; }

  // 先添加事件监听器，再设置 src（避免错过 canplay 事件）
  let hasStarted = false;

  function startPlay() {
    if (hasStarted) return;
    if (token !== videoLoadToken) return;
    hasStarted = true;
    vl.classList.remove('show');
    retryBtn.classList.remove('show');
    clearInterval(videoLoadTimer);
    videoLoadTimer = null;
    videoEl.play().catch(() => {
      // 自动播放被阻止，显示手动播放覆盖层
      playOverlay.classList.add('show');
    });
  }

  // 多事件监听，确保至少一个能触发
  videoEl.addEventListener('canplay', startPlay, { once: true });
  videoEl.addEventListener('loadeddata', startPlay, { once: true });
  videoEl.addEventListener('canplaythrough', startPlay, { once: true });

  videoEl.addEventListener('error', function onError() {
    if (token !== videoLoadToken) return;
    clearInterval(videoLoadTimer);
    videoLoadTimer = null;
    vl.classList.remove('show');
    retryBtn.classList.add('show');
    loadingPct.textContent = '加载失败';
  }, { once: true });

  // 设置视频源并加载（只调用一次 load）
  videoEl.src = lead.video;
  videoEl.load();

  // 进度监控
  videoLoadTimer = setInterval(() => {
    if (token !== videoLoadToken) return;
    // 如果 readyState >= 2（有当前帧数据），尝试播放
    if (!hasStarted && videoEl.readyState >= 2) {
      startPlay();
      return;
    }
    if (videoEl.buffered.length > 0) {
      const buffered = videoEl.buffered.end(videoEl.buffered.length - 1);
      const duration = videoEl.duration || 1;
      const pct = Math.min(100, (buffered / duration) * 100);
      loadingBarFill.style.width = pct + '%';
      loadingPct.textContent = '加载中… ' + Math.floor(pct) + '%';
    }
  }, 200);

  // 超时保护（10秒后如果仍在加载，直接尝试播放已有数据）
  setTimeout(() => {
    if (token !== videoLoadToken) return;
    if (!hasStarted) {
      startPlay();
    }
  }, 10000);
}

// 手动点击播放覆盖层
playOverlay.addEventListener('click', () => {
  playOverlay.classList.remove('show');
  videoEl.play().catch(() => {});
});

// 重试按钮
retryBtn.addEventListener('click', () => {
  if (curVideoIdx >= 0) loadAndPlay(curVideoIdx);
});

// 返回按钮
backBtn.addEventListener('click', () => {
  videoEl.pause();
  showPage(home);
});

// 上一个
prevBtn.addEventListener('click', () => {
  curVideoIdx = (curVideoIdx - 1 + LEADS.length) % LEADS.length;
  loadAndPlay(curVideoIdx);
});

// 下一个
nextBtn.addEventListener('click', () => {
  curVideoIdx = (curVideoIdx + 1) % LEADS.length;
  loadAndPlay(curVideoIdx);
});

// 重放
replayBtn.addEventListener('click', () => {
  videoEl.currentTime = 0;
  videoEl.play().catch(() => {});
});

// 视频结束：停留在当前画面，不自动播放下一个
videoEl.addEventListener('ended', () => {
  // 什么都不做，让用户手动选择
});

/* ========================================================
   烟花页
   ======================================================== */
function showFireworks() {
  showPage(fwPage);
  fwActive = true;
  fwLine1.textContent = '生 日 快 乐';
  fwLine2.textContent = '九界同庆 · 此刻为你绽放';

  // 生成星空
  fwStars.innerHTML = '';
  for (let i = 0; i < 60; i++) {
    const star = document.createElement('div');
    star.className = 'star' + (Math.random() > 0.5 ? ' glow' : '');
    const size = 1 + Math.random() * 2;
    star.style.width = size + 'px';
    star.style.height = size + 'px';
    star.style.left = Math.random() * 100 + '%';
    star.style.top = Math.random() * 65 + '%';
    star.style.color = '#fff';
    star.style.background = '#fff';
    star.style.animationDuration = (1.5 + Math.random() * 2) + 's';
    star.style.animationDelay = Math.random() * 2 + 's';
    fwStars.appendChild(star);
  }

  // 初始化画布
  resizeFwCanvas();
  startFireworks();
  playWin();
}

function resizeFwCanvas() {
  fwCanvas.width = window.innerWidth;
  fwCanvas.height = window.innerHeight;
}

let fwParticles = [];
let fwTimer = null;

function startFireworks() {
  if (fwTimer) clearInterval(fwTimer);
  fwParticles = [];
  // 定期发射烟花
  fwTimer = setInterval(() => {
    if (!fwActive) return;
    const x = fwCanvas.width * (0.15 + Math.random() * 0.7);
    const y = fwCanvas.height * (0.15 + Math.random() * 0.4);
    launchFirework(x, y);
  }, 800);
  // 立即发射一发
  setTimeout(() => {
    launchFirework(fwCanvas.width / 2, fwCanvas.height * 0.3);
  }, 100);
  animateFireworks();
}

function launchFirework(x, y) {
  const colors = ['#ff5252', '#ffd740', '#69f0ae', '#40c4ff', '#b388ff', '#ff80ab', '#ffffff'];
  const color = colors[Math.floor(Math.random() * colors.length)];
  const count = 40 + Math.floor(Math.random() * 20);
  for (let i = 0; i < count; i++) {
    const angle = (Math.PI * 2 * i) / count;
    const speed = 2 + Math.random() * 3;
    fwParticles.push({
      x: x, y: y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life: 1,
      decay: 0.01 + Math.random() * 0.015,
      color: color,
      size: 2 + Math.random() * 2
    });
  }
  playBoom();
}

function animateFireworks() {
  if (!fwActive) return;
  const ctx = fwCanvas.getContext('2d');
  // 拖尾效果
  ctx.fillStyle = 'rgba(10, 14, 39, 0.2)';
  ctx.fillRect(0, 0, fwCanvas.width, fwCanvas.height);

  fwParticles = fwParticles.filter(p => {
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.05; // 重力
    p.vx *= 0.99;
    p.vy *= 0.99;
    p.life -= p.decay;
    if (p.life <= 0) return false;

    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.shadowBlur = 10;
    ctx.shadowColor = p.color;
    ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
    return true;
  });
  ctx.globalAlpha = 1;
  ctx.shadowBlur = 0;

  requestAnimationFrame(animateFireworks);
}

// 烟花页：点击重新开始
fwHint.addEventListener('click', () => {
  fwActive = false;
  if (fwTimer) clearInterval(fwTimer);
  fwParticles = [];
  // 重置进度，重新开始
  watched = [];
  saveProgress();
  renderHome();
  showPage(home);
});

/* ========================================================
   窗口大小变化
   ======================================================== */
window.addEventListener('resize', () => {
  if (fwActive) resizeFwCanvas();
  // 重新生成草叶
  grassTop.innerHTML = '';
  const bladeCount = Math.floor(window.innerWidth / 8);
  for (let i = 0; i < bladeCount; i++) {
    const blade = document.createElement('div');
    blade.className = 'grass-blade';
    blade.style.setProperty('--blade-h', (5 + Math.random() * 5) + 'px');
    grassTop.appendChild(blade);
  }
});

/* ========================================================
   首次用户交互时恢复音频上下文（移动端必需）
   ======================================================== */
document.addEventListener('touchstart', function unlockAudio() {
  getCtx();
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  document.removeEventListener('touchstart', unlockAudio);
}, { once: true });

document.addEventListener('click', function unlockAudio() {
  getCtx();
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  document.removeEventListener('click', unlockAudio);
}, { once: true });

/* ========================================================
   初始化
   ======================================================== */
loadProgress();
renderHome();
</script>
